<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dealer Signature Predictor</title>
    <style>
        :root { --gold: #d4af37; --bg: #0f0f0f; --card: #1a1a1a; --win: #2ecc71; }
        body { font-family: sans-serif; background: var(--bg); color: #eee; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .panel { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; }
        h2 { color: var(--gold); margin-top: 0; border-bottom: 1px solid var(--gold); padding-bottom: 10px; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input { background: #222; border: 1px solid #444; color: white; padding: 10px; border-radius: 4px; flex-grow: 1; }
        button { background: var(--gold); border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        
        .prediction-display { text-align: center; padding: 20px; background: #222; border: 2px dashed var(--gold); }
        .prediction-number { font-size: 3em; color: var(--win); display: block; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
        .stat-card { background: #252525; padding: 10px; border-radius: 4px; }
        .history-list { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
        .num-tag { background: #333; padding: 5px 10px; border-radius: 3px; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align:center">
        <h1 style="color:var(--gold)">SHADOW ROULETTE ENGINE</h1>
        <p>Dealer Signature & Phase Tracking</p>
    </header>

    <div class="panel">
        <h2>Input Data</h2>
        <div class="input-group">
            <input type="text" id="historyInput" placeholder="Paste history (e.g. 32, 15, 19, 4)">
            <button onclick="loadHistory()">Load History</button>
        </div>
        <div class="input-group">
            <input type="number" id="singleInput" placeholder="New Spin" min="0" max="36">
            <button onclick="addSingleSpin()">Add Spin</button>
        </div>
        <div id="historyDisplay" class="history-list"></div>
    </div>

    <div class="panel">
        <h2>Live Prediction</h2>
        <div id="predictionBox" class="prediction-display">
            <span id="predictText">AWAITING DATA...</span>
            <span id="predictVal" class="prediction-number">--</span>
            <span id="predictType" style="color:var(--gold)"></span>
        </div>
    </div>

    <div class="panel">
        <h2>Engine Insights</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <div>Travel Dist.</div>
                <div id="statTravel" style="font-size: 1.5em; color: var(--gold);">0</div>
            </div>
            <div class="stat-card">
                <div>Rhythm</div>
                <div id="statRhythm" style="font-size: 1.1em;">STABLE</div>
            </div>
            <div class="stat-card">
                <div>Phase</div>
                <div id="statPhase" style="font-size: 1.1em;">NEUTRAL</div>
            </div>
        </div>
    </div>
</div>

<script>
    // European Wheel Sequence
    const wheel = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    let spins = [];

    function getDistance(n1, n2) {
        let p1 = wheel.indexOf(parseInt(n1));
        let p2 = wheel.indexOf(parseInt(n2));
        let dist = p2 - p1;
        if (dist < 0) dist += 37;
        return dist;
    }

    function updateUI() {
        const historyDiv = document.getElementById('historyDisplay');
        historyDiv.innerHTML = spins.slice(-10).map(s => `<span class="num-tag">${s}</span>`).join('');

        if (spins.length < 2) return;

        let last = spins[spins.length - 1];
        let prev = spins[spins.length - 2];
        let travel = getDistance(prev, last);
        
        document.getElementById('statTravel').innerText = travel;

        // Logic based on Image: "Small Travel usually maintain phase"
        // If travel is less than 12 pockets, predict the same jump (Phase Keeping)
        if (travel <= 15) {
            let nextIndex = (wheel.indexOf(parseInt(last)) + travel) % 37;
            let predictedNum = wheel[nextIndex];
            
            document.getElementById('predictText').innerText = "PREDICTION ACTIVE";
            document.getElementById('predictVal').innerText = predictedNum + "n9";
            document.getElementById('predictType').innerText = "PHASE KEEPING (SMALL TRAVEL)";
            document.getElementById('statRhythm').innerText = "CONSISTENT";
            document.getElementById('statRhythm').style.color = "var(--win)";
        } else {
            document.getElementById('predictText').innerText = "HIGH VOLATILITY";
            document.getElementById('predictVal').innerText = "WAIT";
            document.getElementById('predictType').innerText = "Large jump detected - Rhythm unstable";
            document.getElementById('statRhythm').innerText = "UNSTABLE";
            document.getElementById('statRhythm').style.color = "#e74c3c";
        }
    }

    function addSingleSpin() {
        let val = document.getElementById('singleInput').value;
        if (val !== "" && val >= 0 && val <= 36) {
            spins.push(parseInt(val));
            document.getElementById('singleInput').value = "";
            updateUI();
        }
    }

    function loadHistory() {
        let raw = document.getElementById('historyInput').value;
        let processed = raw.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));
        spins = [...spins, ...processed];
        updateUI();
    }

    // Allow "Enter" key to add spin
    document.getElementById('singleInput').addEventListener("keyup", function(event) {
        if (event.key === "Enter") addSingleSpin();
    });
</script>

</body>
</html>
