<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Roulette - Click Interface</title>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --card: #161616; --win: #2ecc71; --red: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* Prediction Header */
        .prediction-panel { width: 100%; max-width: 800px; background: var(--card); border: 2px solid var(--gold); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        .predict-val { font-size: 4em; font-weight: bold; color: var(--win); margin: 10px 0; display: block; }
        .predict-sub { color: var(--gold); font-weight: bold; letter-spacing: 1px; }

        /* Roulette Table Grid */
        .roulette-table { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; background: #000; padding: 10px; border: 2px solid #333; border-radius: 8px; margin-bottom: 20px; width: 100%; max-width: 900px; overflow-x: auto; }
        .cell { aspect-ratio: 1/1.5; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); font-size: 1.2rem; transition: transform 0.1s; }
        .cell:hover { transform: scale(1.05); filter: brightness(1.3); }
        .cell:active { transform: scale(0.95); }
        .zero { grid-row: span 3; background: var(--win); color: #000; }
        .red { background: var(--red); }
        .black { background: #222; }

        /* History & Stats */
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 800px; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 15px; border-radius: 8px; text-align: center; border-bottom: 3px solid #333; }
        .history-strip { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 800px; margin-top: 10px; }
        .hist-chip { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: bold; border: 1px solid #444; }

        .label { display: block; font-size: 0.7em; color: #888; text-transform: uppercase; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="prediction-panel">
        <span class="label">Next Prediction</span>
        <span id="predictVal" class="predict-val">--</span>
        <span id="predictType" class="predict-sub">WAITING FOR SPINS...</span>
    </div>

    <div class="stats-bar">
        <div class="stat-box">
            <span class="label">Travel Distance</span>
            <span id="distVal" style="font-size: 1.5em; color: var(--gold);">0</span>
        </div>
        <div class="stat-box">
            <span class="label">Structure</span>
            <span id="structVal" style="color: var(--win);">STABLE</span>
        </div>
        <div class="stat-box">
            <span class="label">Last Hit</span>
            <span id="lastVal" style="font-size: 1.5em;">--</span>
        </div>
    </div>

    <div class="roulette-table" id="rouletteTable">
        <div class="cell zero" onclick="addSpin(0)">0</div>
        </div>

    <div class="history-strip" id="historyStrip"></div>

    <script>
        const wheel = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
        const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
        let spins = [];

        // Generate Table Layout (3 columns, numbers in order)
        const table = document.getElementById('rouletteTable');
        for (let i = 1; i <= 36; i++) {
            const colorClass = redNumbers.includes(i) ? 'red' : 'black';
            const cell = document.createElement('div');
            cell.className = `cell ${colorClass}`;
            cell.innerText = i;
            cell.onclick = () => addSpin(i);
            
            // Re-ordering logic for the grid to look like a standard table
            // 3 rows: [3,6,9...], [2,5,8...], [1,4,7...]
            if (i % 3 === 0) cell.style.gridRow = "1";
            if (i % 3 === 2) cell.style.gridRow = "2";
            if (i % 3 === 1) cell.style.gridRow = "3";
            
            table.appendChild(cell);
        }

        function addSpin(num) {
            spins.push(num);
            processData();
        }

        function processData() {
            if (spins.length < 1) return;
            
            const last = spins[spins.length - 1];
            document.getElementById('lastVal').innerText = last;
            updateHistory();

            if (spins.length < 2) return;

            const prev = spins[spins.length - 2];
            const travel = calculateDistance(prev, last);
            
            document.getElementById('distVal').innerText = travel;

            // STRATEGY LOGIC:
            // "Small Travel = Phase Keeping (Stable)"
            // "Big Travel = Direction Switches (Volatility)"
            if (travel <= 12) {
                let targetIndex = (wheel.indexOf(last) + travel) % 37;
                let prediction = wheel[targetIndex];
                
                document.getElementById('predictVal').innerText = prediction + "n9";
                document.getElementById('predictType').innerText = "STABLE PHASE: BET NEIGHBORS";
                document.getElementById('structVal').innerText = "STABLE";
                document.getElementById('structVal').style.color = "var(--win)";
            } else {
                document.getElementById('predictVal').innerText = "WAIT";
                document.getElementById('predictType').innerText = "HIGH VOLATILITY DETECTED";
                document.getElementById('structVal').innerText = "RANDOM";
                document.getElementById('structVal').style.color = "var(--red)";
            }
        }

        function calculateDistance(n1, n2) {
            let p1 = wheel.indexOf(n1);
            let p2 = wheel.indexOf(n2);
            let d = p2 - p1;
            return d < 0 ? d + 37 : d;
        }

        function updateHistory() {
            const strip = document.getElementById('historyStrip');
            const lastNum = spins[spins.length-1];
            const color = lastNum === 0 ? 'var(--win)' : (redNumbers.includes(lastNum) ? 'var(--red)' : '#222');
            
            const chip = document.createElement('div');
            chip.className = 'hist-chip';
            chip.style.backgroundColor = color;
            chip.innerText = lastNum;
            
            strip.prepend(chip);
            if (strip.children.length > 15) strip.lastChild.remove();
        }
    </script>
</body>
</html>
