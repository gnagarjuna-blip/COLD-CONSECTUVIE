<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roulette Terminal Predictor</title>
    <style>
        body { font-family: sans-serif; background: #1a472a; color: white; display: flex; flex-direction: column; align-items: center; }
        .grid-container { display: grid; grid-template-columns: repeat(12, 50px); gap: 5px; margin: 20px; border: 2px solid gold; padding: 10px; }
        .cell { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #ccc; font-weight: bold; border-radius: 4px; transition: 0.2s; }
        .cell:hover { transform: scale(1.1); background: gold !important; color: black; }
        .red { background: #c21807; }
        .black { background: #111; }
        .zero { background: #008000; grid-column: 1 / 13; width: auto; margin-bottom: 10px; }
        #results { background: rgba(0,0,0,0.5); padding: 20px; border-radius: 10px; width: 80%; max-width: 600px; text-align: center; }
        .highlight { color: #f1c40f; font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Roulette Terminal Predictor</h1>
    <p>Click a number to see the imaginary numbers and their terminals.</p>

    <div class="grid-container" id="board">
        </div>

    <div id="results">
        <h3>Analysis for Number: <span id="selected-num">-</span></h3>
        <p>Imaginary Numbers: <span id="imaginary-nums" class="highlight"></span></p>
        <p>Predicted Terminals: <span id="prediction" class="highlight"></span></p>
    </div>

<script>
    const terminals = {
        1:[8], 2:[7,9], 3:[8], 4:[11], 5:[10,12], 6:[11], 7:[2,9], 8:[1,3,13,15], 9:[2,14],
        10:[5,17], 11:[4,6,16,18], 12:[5,17], 13:[8,20], 14:[7,9,19,21], 15:[8,20], 16:[11,23],
        17:[10,12,22,24], 18:[11,23], 19:[14,26], 20:[13,15,25,27], 21:[14,26], 22:[17,29],
        23:[16,18,28,30], 24:[17,29], 25:[20,32], 26:[19,21,31,33], 27:[20,32], 28:[23,35],
        29:[22,24,34,36], 30:[23,35], 31:[26], 32:[25,27], 33:[26], 34:[29], 35:[28,30], 36:[29]
    };

    const redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];

    function setupBoard() {
        const board = document.getElementById('board');
        // We iterate through columns as per roulette layout (3 rows)
        for (let row = 3; row >= 1; row--) {
            for (let i = 0; i < 12; i++) {
                let num = (i * 3) + row;
                const div = document.createElement('div');
                div.className = `cell ${redNumbers.includes(num) ? 'red' : 'black'}`;
                div.textContent = num;
                div.onclick = () => calculate(num, row);
                board.appendChild(div);
            }
        }
    }

    function calculate(num, colType) {
        let imaginary = [];
        // Determine offsets based on column type
        if (colType === 1) imaginary = [num + 1, num - 1];
        else if (colType === 2) imaginary = [num + 2, num - 2];
        else if (colType === 3) imaginary = [num + 3, num - 3];

        // Filter out numbers outside 1-36 range
        const validImaginary = imaginary.filter(n => n >= 1 && n <= 36);
        
        let allTerminals = [];
        validImaginary.forEach(img => {
            allTerminals.push(img); // Include imaginary number itself
            if (terminals[img]) {
                allTerminals.push(...terminals[img]);
            }
        });

        // Update UI
        document.getElementById('selected-num').textContent = num;
        document.getElementById('imaginary-nums').textContent = validImaginary.join(', ');
        document.getElementById('prediction').textContent = [...new Set(allTerminals)].join(', ');
    }

    setupBoard();
</script>
</body>
</html>
