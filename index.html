<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Pro - Dynamic Bet Engine</title>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --card: #161616; --win: #2ecc71; --red: #e74c3c; --orange: #ff8c00; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1100px; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 15px; }
        .panel { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 15px; }
        
        /* Prediction Header */
        .prediction-header { text-align: center; border: 2px solid var(--gold); background: #111; margin-bottom: 10px; padding: 20px; }
        .bet-display { font-size: 4rem; font-weight: bold; color: var(--win); line-height: 1.2; margin: 10px 0; min-height: 80px; }
        .sub-text { font-size: 0.8rem; letter-spacing: 2px; color: var(--gold); font-weight: bold; text-transform: uppercase; }

        /* Dropdown Styling */
        select { background: #222; color: var(--gold); border: 1px solid var(--gold); padding: 10px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; margin-bottom: 10px; }

        /* Table Grid */
        .roulette-table { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; background: #000; padding: 8px; border-radius: 8px; border: 1px solid #333; }
        .cell { aspect-ratio: 1/1.4; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border-radius: 3px; border: 1px solid rgba(255,255,255,0.03); font-size: 0.9rem; }
        .cell:hover { background: #333; }
        .zero { grid-row: span 3; background: var(--win); color: #000; }
        .red { background: var(--red); }
        .black { background: #222; }

        .log-box { height: 300px; overflow-y: auto; background: #000; padding: 10px; border-radius: 8px; font-family: monospace; border: 1px solid #222; margin-top: 10px; }
        .log-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #111; font-size: 0.8rem; }
        textarea { width: 100%; background: #000; color: var(--gold); border: 1px solid #444; padding: 10px; border-radius: 6px; height: 50px; box-sizing: border-box; }
        button { width: 100%; background: var(--gold); border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 6px; margin-top: 10px; }
        .history-strip { display: flex; gap: 4px; overflow-x: auto; margin-top: 10px; padding: 5px 0; }
        .chip { min-width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div>
        <div class="panel prediction-header">
            <span class="label">Select Strategy Mode</span>
            <select id="betType" onchange="processEngine()">
                <option value="single">Single Number</option>
                <option value="split">Split (Main + Hot Neighbor)</option>
                <option value="street">Street (Row of 3)</option>
                <option value="doubleStreet">Double Street (6-Line)</option>
            </select>
            <div id="betResult" class="bet-display">--</div>
            <div id="logicNote" class="sub-text">Awaiting Data</div>
        </div>

        <div class="roulette-table" id="rouletteTable">
            <div class="cell zero" onclick="addSpin(0)">0</div>
        </div>

        <div class="history-strip" id="historyStrip"></div>
    </div>

    <div>
        <div class="panel">
            <span class="label">Session Stats</span>
            <div id="winRate" style="font-size: 1.5rem; font-weight: bold; color: var(--win);">Rate: 0%</div>
            <div class="log-box" id="logBox"></div>
        </div>

        <div class="panel" style="margin-top: 15px;">
            <span class="label">Bulk Data</span>
            <textarea id="bulkPaste" placeholder="e.g. 1, 5, 22..."></textarea>
            <button onclick="importData()">Sync Engine</button>
        </div>
    </div>
</div>

<script>
    const wheel = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const redNums = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
    let spins = [];
    let travelLog = [];
    let currentBet = [];

    // Table Generation
    const table = document.getElementById('rouletteTable');
    for(let i=1; i<=36; i++){
        const c = document.createElement('div');
        c.className = `cell ${redNums.includes(i) ? 'red' : 'black'}`;
        c.innerText = i;
        c.onclick = () => addSpin(i);
        if(i%3===0) c.style.gridRow = "1";
        if(i%3===2) c.style.gridRow = "2";
        if(i%3===1) c.style.gridRow = "3";
        table.appendChild(c);
    }

    function addSpin(num) {
        if(currentBet.length > 0) {
            const isHit = currentBet.includes(num);
            updateLog(num, currentBet, isHit);
        }
        spins.push(num);
        if(spins.length > 1) {
            let dist = wheel.indexOf(num) - wheel.indexOf(spins[spins.length-2]);
            if(dist < 0) dist += 37;
            travelLog.push(dist);
        }
        processEngine();
        updateUI();
    }

    function processEngine() {
        if(spins.length < 3) return;

        const avgTravel = travelLog.slice(-10).reduce((a,b)=>a+b,0) / travelLog.length;
        const lastNum = spins[spins.length-1];
        const lastTravel = travelLog[travelLog.length-1];
        
        // Pivot Number Calculation
        let jump = (lastTravel > avgTravel) ? Math.round(avgTravel + 2) : Math.round(avgTravel - 2);
        let pivot = wheel[(wheel.indexOf(lastNum) + jump) % 37];
        
        const type = document.getElementById('betType').value;
        let finalBet = [];
        let label = "";

        switch(type) {
            case 'single':
                finalBet = [pivot];
                label = `Single: ${pivot}`;
                break;
            case 'split':
                const neighbors = getTableNeighbors(pivot);
                const hotNeighbor = neighbors.sort((a,b) => 
                    spins.filter(s => s === b).length - spins.filter(s => s === a).length
                )[0];
                finalBet = [pivot, hotNeighbor];
                label = `Split: ${pivot}-${hotNeighbor}`;
                break;
            case 'street':
                const start = pivot - ((pivot - 1) % 3);
                finalBet = [start, start+1, start+2];
                label = `Street: ${start}-${start+2}`;
                break;
            case 'doubleStreet':
                const rowStart = pivot - ((pivot - 1) % 3);
                const secondRow = (rowStart > 30) ? rowStart - 3 : rowStart + 3;
                finalBet = [rowStart, rowStart+1, rowStart+2, secondRow, secondRow+1, secondRow+2].sort((a,b)=>a-b);
                label = `6-Line: ${finalBet[0]}-${finalBet[5]}`;
                break;
        }

        currentBet = finalBet;
        document.getElementById('betResult').innerText = finalBet.join(", ");
        document.getElementById('logicNote').innerText = label;
    }

    function getTableNeighbors(n) {
        if (n === 0) return [1, 2, 3];
        let res = [];
        if (n > 3) res.push(n - 3); // Above
        if (n < 34) res.push(n + 3); // Below
        if (n % 3 !== 1) res.push(n - 1); // Left
        if (n % 3 !== 0) res.push(n + 1); // Right
        return res;
    }

    function updateLog(actual, bet, hit) {
        const lb = document.getElementById('logBox');
        const row = document.createElement('div');
        row.className = 'log-row';
        row.innerHTML = `<span>Spin #${spins.length}: ${actual}</span> <b style="color:${hit?'var(--win)':'var(--red)'}">${hit?'HIT':'MISS'}</b>`;
        lb.prepend(row);
    }

    function updateUI() {
        const strip = document.getElementById('historyStrip');
        strip.innerHTML = spins.slice(-20).reverse().map(n => {
            const color = n === 0 ? 'var(--win)' : (redNums.includes(n) ? 'var(--red)' : '#222');
            return `<div class="chip" style="background:${color}">${n}</div>`;
        }).join('');
    }

    function importData() {
        const val = document.getElementById('bulkPaste').value;
        const nums = val.split(/[\s,]+/).map(Number).filter(n => !isNaN(n) && n >= 0 && n <= 36);
        nums.forEach(n => addSpin(n));
        document.getElementById('bulkPaste').value = "";
    }
</script>
</body>
</html>
